<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Toolkit Logic Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --border: #1a1a1a;
            --amber: #c8781a;
            --text: #ffffff;
            --dim: #444444;
            --blue: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Space Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 380px 450px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .inputs { padding: 40px; border-right: 1px solid var(--border); }
        
        h1 { 
            font-family: 'Syne', sans-serif; 
            font-size: 32px; 
            color: var(--amber); 
            line-height: 1; 
            margin-bottom: 35px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            font-weight: 800;
        }

        .field { margin-bottom: 20px; }
        label { display: block; font-size: 10px; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        
        input[type="number"] {
            width: 100%; background: #000; border: 2px solid var(--border);
            padding: 12px; color: #fff; font-family: 'Space Mono', monospace;
            font-size: 18px; outline: none; border-radius: 4px;
        }
        input:focus { border-color: #fff; }

        .type-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .type-btn {
            background: #000; border: 2px solid var(--border); color: var(--dim);
            padding: 10px; font-size: 9px; cursor: pointer; text-transform: uppercase; font-weight: 800;
        }
        .type-btn.active { background: #fff; color: #000; border-color: #fff; }

        .display { padding: 40px; background: #080808; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .gauge-svg { width: 300px; height: 160px; margin-bottom: 20px; }
        #needle-group { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: 160px 160px; }

        .res-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        
        #final-steps { 
            font-family: 'Syne', sans-serif; 
            font-size: 72px; 
            color: #fff; 
            line-height: 0.9; 
            font-weight: 800; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="inputs">
        <h1>Logic<br>Engine</h1>
        
        <div class="field">
            <label>Training Type</label>
            <div class="type-selector">
                <button class="type-btn active" onclick="setType(12, this)">Style</button>
                <button class="type-btn" onclick="setType(20, this)">Concept</button>
                <button class="type-btn" onclick="setType(35, this)">Character</button>
            </div>
        </div>

        <div class="field"><label>Images</label><input type="number" id="in-img" value="48" min="1" oninput="calc()"></div>
        <div class="field"><label>Repeats</label><input type="number" id="in-rep" value="1" min="1" oninput="calc()"></div>
        <div class="field"><label>Batch Size</label><input type="number" id="in-bat" value="1" min="1" oninput="calc()"></div>
    </div>

    <div class="display">
        <svg class="gauge-svg" viewBox="0 0 320 180">
            <path d="M 50 160 A 110 110 0 0 1 270 160" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="butt"/>
            <g id="needle-group" transform="rotate(-90, 160, 160)">
                <rect id="needle-bar" x="154" y="45" width="12" height="115" fill="#fff" />
                <circle cx="160" cy="160" r="14" fill="#fff" />
            </g>
        </svg>

        <div class="res-label">Steps per Config</div>
        <div id="final-steps">576</div>
    </div>
</div>

<script>
    let intensity = 12;

    function setType(val, btn) {
        intensity = val;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calc();
    }

    function calc() {
        const img = Math.max(1, parseFloat(document.getElementById('in-img').value) || 1);
        const rep = Math.max(1, parseFloat(document.getElementById('in-rep').value) || 1);
        const bat = Math.max(1, parseFloat(document.getElementById('in-bat').value) || 1);

        const totalSteps = Math.round(((img * rep) / bat) * intensity);
        document.getElementById('final-steps').innerText = totalSteps.toLocaleString();

        let rotation = -90 + (totalSteps / 6000) * 180;
        if (rotation > 90) rotation = 90;
        if (rotation < -90) rotation = -90;
        document.getElementById('needle-group').style.transform = `rotate(${rotation}deg)`;

        const bar = document.getElementById('needle-bar');

        if (totalSteps < 1500) {
            bar.style.fill = "var(--blue)";
        } else if (totalSteps <= 4000) {
            bar.style.fill = "var(--green)";
        } else {
            bar.style.fill = "var(--red)";
        }
    }
    calc();
</script>
</body>
</html>
